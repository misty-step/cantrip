[workspace]
members = ["crates/core", "crates/app"]
default-members = ["crates/core", "crates/app"]
resolver = "2"

[workspace.package]
version = "2.0.0-dev"
edition = "2021"
license = "MIT"
repository = "https://github.com/misty-step/cantrip"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"

[profile.release]
lto = "thin"
