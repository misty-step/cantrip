[package]
name = "cantrip"
version = "0.1.1"
edition = "2021"
description = "Local-first dictation for Linux: hold a key, speak, get text."
license = "MIT"
repository = "https://github.com/misty-step/cantrip"
homepage = "https://github.com/misty-step/cantrip"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
transcribe-rs = { version = "0.3", features = ["onnx"] }
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }
ureq = "2"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
dbus = "0.9.12"
parking_lot = "0.12"
smithay-client-toolkit = { version = "0.21.1", default-features = false }
wayland-client = "0.31.14"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
eframe = "0.29"
ab_glyph = "0.2"
epaint_default_fonts = "0.29"
toml_edit = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = []
cuda = ["transcribe-rs/ort-cuda"]

[dev-dependencies]
hound = "3.5"

[profile.release]
lto = "thin"
