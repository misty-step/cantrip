repo: misty-step/cantrip
agents:
  builder:  { poll: "forest poll builder",  interval: 300 }
  verifier: { poll: "forest poll verifier", interval: 120 }
  fixer:    { poll: "forest poll fixer",    interval: 300 }
checks:
  - name: fmt
    run: cargo fmt --check
  - name: clippy
    run: cargo clippy --all-targets -- -D warnings
  - name: test
    run: cargo test
