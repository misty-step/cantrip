name: Website

on:
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - 'scripts/check-site'
      - '.github/workflows/site.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      refresh-release-data:
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: cantrip-website-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  site:
    if: >-
      github.event_name == 'pull_request' ||
      (github.ref == 'refs/heads/master' &&
       contains(fromJSON('["push","workflow_dispatch"]'), github.event_name))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select the already-qualified website source for release-data refresh
        if: inputs.refresh-release-data
        id: website-source
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/release site-refresh-source
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: inputs.refresh-release-data
        with:
          ref: ${{ steps.website-source.outputs.source_revision }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Refresh published release inputs
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm --prefix site run sync:releases
      - name: Check and build the same static site used locally
        run: python3 scripts/check-site
      - name: Deploy the verified static build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b069014f6a46558ea9146fb6c4ff8f6c
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is required for production deployment.' >&2; exit 1; }
          python3 ../scripts/release check-site-promotion
          npm run deploy -- --message "git:$(git rev-parse HEAD) run:$GITHUB_RUN_ID"
      - name: Verify public routes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          for path in / /health.json /docs/install /docs/use /docs/configuration /docs/desktop /docs/privacy /changelog /releases /evals /evals/latest.json; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "https://cantrip.mistystep.io$path" --output /dev/null
          done
          # A healthy edge may still serve the previous build for a moment after deploy.
          scripts/verify-site site/dist/index.html https://cantrip.mistystep.io/
          scripts/verify-site site/dist/changelog/index.html https://cantrip.mistystep.io/changelog
          scripts/verify-site site/dist/evals/index.html https://cantrip.mistystep.io/evals
          scripts/verify-site site/dist/health.json https://cantrip.mistystep.io/health.json
