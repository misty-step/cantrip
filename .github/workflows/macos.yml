name: Native macOS

# Cantrip v2 on a real Mac: link, test and lint the workspace natively. Linux CI
# only type-checks the macOS platform module (no Apple SDK there). Runtime
# behavior (AX insertion, CGEventPostToPid paste, NSPasteboard, Core Audio tap,
# SFSpeechRecognizer, HUD panel) still needs the attended checklist in
# ARCHITECTURE.md › Verification boundaries.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: cantrip-macos-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MACOSX_DEPLOYMENT_TARGET: "15.0"

jobs:
  native:
    name: macOS 15 arm64 workspace
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the repository-pinned Rust toolchain
        run: rustup install
      - name: Build, lint and test natively
        run: |
          cargo build --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
