name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITLEAKS_VERSION: v8.30.1
  TRUFFLEHOG_VERSION: v3.96.0

jobs:
  check:
    # Runner image stays a mutable label on purpose: GitHub publishes patched
    # images under ubuntu-latest and does not provide per-run SHA-pinned
    # images. Third-party actions below are pinned to full commit SHAs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libssl-dev pkg-config
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the repository-pinned Rust toolchain
        run: rustup install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: ./scripts/check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # full history for the gitleaks history scan
      - name: Install gitleaks (pinned release)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Gitleaks — full-history scan (fails on any leak)
        run: /tmp/gitleaks git . --no-banner --exit-code 1
      - name: Install trufflehog (pinned release)
        run: |
          curl -sSfL "https://github.com/trufflesecurity/trufflehog/releases/download/${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION#v}_linux_amd64.tar.gz" -o /tmp/trufflehog.tgz
          mkdir -p /tmp/th && tar -xzf /tmp/trufflehog.tgz -C /tmp/th trufflehog
      - name: TruffleHog — working-tree scan (fails on any finding)
        run: /tmp/th/trufflehog filesystem . --exclude-paths .trufflehog-exclude --fail

  release:
    needs: [check, secret-scan]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
