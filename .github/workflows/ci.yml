name: Release qualification

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: cantrip-qualification-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GITLEAKS_VERSION: v8.30.1
  TRUFFLEHOG_VERSION: v3.96.0

jobs:

  rust:
    # Tier/cache policy: docs/decisions/0035-bounded-ci-feedback.md
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      # Omit bulky debug symbols, not debug assertions or test coverage.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev libssl-dev pkg-config
      - name: Install the repository-pinned Rust toolchain
        run: rustup install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-debug0-cpu
      - name: Check the locked workspace and offline evaluation
        run: ./scripts/check rust

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check installer, release, integration and website contracts
        run: ./scripts/check contracts

  check:
    # Qualification policy: docs/decisions/0035-bounded-ci-feedback.md
    needs: [rust, contracts]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every Linux tier
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
        run: test "$RUST_RESULT" = success && test "$CONTRACTS_RESULT" = success

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # full history for the gitleaks history scan
          persist-credentials: false
      - name: Install gitleaks (pinned release)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Gitleaks — full-history scan (fails on any leak)
        run: /tmp/gitleaks git . --no-banner --exit-code 1
      - name: Install trufflehog (pinned release)
        run: |
          curl -sSfL "https://github.com/trufflesecurity/trufflehog/releases/download/${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION#v}_linux_amd64.tar.gz" -o /tmp/trufflehog.tgz
          mkdir -p /tmp/th && tar -xzf /tmp/trufflehog.tgz -C /tmp/th trufflehog
      - name: TruffleHog — working-tree scan (fails on any finding)
        run: /tmp/th/trufflehog filesystem . --exclude-paths .trufflehog-exclude --fail

  native:
    uses: ./.github/workflows/macos.yml

  release-gate:
    needs: [check, secret-scan, native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require portable and both native qualifications
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          SCAN_RESULT: ${{ needs.secret-scan.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$CHECK_RESULT" = success && test "$SCAN_RESULT" = success && test "$NATIVE_RESULT" = success
