# verifier: one worktree change to an independent verdict.
#
# This lane reads the proposed diff and may write only review.json.
# Every network surface is denied, so review cannot push, fetch, or research.
# The verifier uses a different model family from the Builder.
description: "The Verifier reviews one change against its item and writes review.json."
harness: opencode
mode: primary
model: openrouter/openai/gpt-5.6-luna
variant: max
# A large diff costs the reviewer reads before it can judge. Keep headroom so a
permission:
  read: allow
  edit: allow
  glob: allow
  grep: allow
  list: allow
  bash: allow
  lsp: allow
  webfetch: deny
  websearch: deny
  task: deny
  skill: deny
  todowrite: deny
  external_directory: deny
  question: deny
mcp:
  - name: exa
    type: remote
    url: http://mint.tail5f5eb4.ts.net:4949/proxy/https/mcp.exa.ai/mcp
    header: __mint.exa.default__
    enabled: false
