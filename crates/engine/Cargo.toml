[package]
name = "cantrip-engine"
version.workspace = true
edition = "2021"
license = "MIT"
publish = false
description = "Shared local-first dictation workflow and private recording history"

[dependencies]
anyhow = "1"
base64 = "0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
transcribe-rs = { version = "0.3", features = ["onnx"] }
ureq = "2"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
tracing = "0.1"
libc = "0.2"
rubato = { version = "0.16.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[features]
default = []
cuda = ["transcribe-rs/ort-cuda"]

[dev-dependencies]
hound = "3.5"
parking_lot = "0.12"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
