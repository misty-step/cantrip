[package]
name = "cantrip"
description = "Cantrip v2: dictation and meeting notes for macOS and Linux."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cantrip"
path = "src/main.rs"

[dependencies]
cantrip-core = { path = "../core" }
anyhow = "1"
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
# ui (owned by the ui module)
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }

# linux platform (owned by platform/linux)
[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "3", features = ["json"] }
dbus = "0.9"
ksni = "0.2.2"

# macos platform (owned by platform/macos)
[target.'cfg(target_os = "macos")'.dependencies]
ureq = { version = "3", default-features = false, features = ["json", "native-tls", "gzip"] }

[dev-dependencies]
tempfile = "3"
